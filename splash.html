<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aura Splash</title>
  <style>
    :root {
      --accent: #22c55e;
      --accent-secondary: #0ea5e9;
      --bg: #05070a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* Main Window Container */
    .splash-wrapper {
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      border-radius: 16px;
      box-sizing: border-box;
      position: relative;
      -webkit-app-region: drag;
      overflow: hidden;
      /* Subtle inner border for depth */
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 
                  0 20px 40px rgba(0, 0, 0, 0.5);
    }

    /* --- ANIMATED BACKGROUND ORBS --- */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      z-index: 0;
      animation: floatOrb 8s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 250px;
      height: 250px;
      background: rgba(34, 197, 94, 0.25);
      top: -50px;
      right: -50px;
    }

    .orb-2 {
      width: 200px;
      height: 200px;
      background: rgba(14, 165, 233, 0.2);
      bottom: -40px;
      left: -40px;
      animation-delay: -4s;
    }

    /* Heavy Glassmorphic Overlay */
    .glass-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      backdrop-filter: blur(40px) saturate(120%);
      background: linear-gradient(135deg, rgba(5, 7, 10, 0.4), rgba(5, 7, 10, 0.8));
    }

    /* --- CONTENT --- */
    .content {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 1s ease-out;
    }

    /* Floating Logo */
    .logo-box {
      width: 80px;
      height: 80px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent), #15803d);
      color: #04130a;
      box-shadow: 0 15px 35px rgba(34, 197, 94, 0.4), 
                  inset 0 2px 4px rgba(255, 255, 255, 0.3);
      font-size: 42px;
      font-weight: 900;
      margin-bottom: 24px;
      animation: floatLogo 4s infinite ease-in-out;
    }

    /* Gradient Title */
    .title {
      font-size: 24px;
      font-weight: 900;
      margin: 0 0 6px 0;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, var(--text), #bbf7d0);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 40px 0;
      letter-spacing: 0.5px;
    }

    /* Sleek Loading Bar */
    .progress-container {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
    }

    .progress-bar {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      border-radius: 99px;
      box-shadow: 0 0 15px var(--accent);
      animation: slide 1.5s infinite ease-in-out;
    }

    /* Version Footer */
    .version {
      position: absolute;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.2);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      z-index: 2;
    }

    /* --- KEYFRAMES --- */
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-30px, 20px) scale(1.1); }
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes slide {
      0% { transform: translateX(-150%); }
      100% { transform: translateX(250%); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="splash-wrapper">
    <!-- Animated background layers -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="glass-overlay"></div>

    <!-- Foreground UI -->
    <div class="content">
      <div class="logo-box">A</div>
      <h1 class="title">Aura Launcher Legacy</h1>
      <p class="subtitle">Waking up components...</p>
      
      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>
    </div>

    <div class="version">V2.0.0-BETA.2</div>
  </div>
</body>
</html>
