<!DOCTYPE html>
<html>
<head>
  <title>Aura Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <div class="logo-box login-logo">A</div>

    <h1>Aura Account</h1>
    <p class="muted">Choose an Offline or Ely.by account.</p>

    <label>Offline Username</label>
    <input id="offlineUsername" placeholder="Player name">
    <button class="play-btn" onclick="loginOffline()">Login Offline</button>

    <div class="divider">or</div>

    <label>Ely.by Username / Email</label>
    <input id="elyUsername" placeholder="Username or email">

    <label>Ely.by Password</label>
    <input id="elyPassword" type="password" placeholder="Password">

    <button class="play-btn" onclick="loginEly()">Login with Ely.by</button>
    <button class="dark-btn" onclick="goBack()">Back</button>

    <p id="loginStatus" class="login-status">Ready</p>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
